name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar plataformas do Android SDK
        shell: bash
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK instalável (debug)
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Disponibilizar o arquivo APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasVoos-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
